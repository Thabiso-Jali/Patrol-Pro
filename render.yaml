services:
  - type: web
    name: patrol-pro-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"
      --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: demo
      - key: APP_NAME
        value: Patrol Pro API
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: patrol-pro-demo-db
          property: connectionString

  - type: web
    name: patrol-pro-demo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: "off"
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: GENERATE_SOURCEMAP
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

databases:
  - name: patrol-pro-demo-db
    plan: free
    region: frankfurt
    databaseName: patrol_pro_demo
    ipAllowList: []
