services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: patrol_pro_demo
      POSTGRES_USER: patrol_pro
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrol_pro -d patrol_pro_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - patrol_pro_demo_data:/var/lib/postgresql/data

volumes:
  patrol_pro_demo_data:
